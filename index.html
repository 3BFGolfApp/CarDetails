<style>
/* Layout: single dark-grey theme. Tab bar pinned at the top. Summary: guide buttons, coming-up list, reg plates in thirds, then each car's MOT / Road Tax / Insurance tiles stacked under its plate. Traffic-light status: green > 2 months, yellow ≤ 2 months, amber ≤ 1 month, red overdue. Motorway-sign blue as accent, number-plate yellow for the reg. */
:root{
  --bg:#2a2d32; --surface:#363a40; --surface-2:#41464d; --line:#4d535b;
  --fg:#f3f4f6; --muted:#b4bac3; --accent:#7fb0f0; --accent-fg:#16191d; --accent-soft:#34465e;
  --plate:#f7c600; --plate-front:#f4f4f0; --plate-ink:#111111;
  --ok:#6fd394; --ok-soft:#24402f; --soon:#ecd35a; --soon-soft:#433c1a; --warn:#f5a04a; --warn-soft:#4a3219; --bad:#f58a84; --bad-soft:#4d2222;
  --tl-green:#1e7f41; --tl-yellow:#a68400; --tl-amber:#c8680a; --tl-red:#c3302b; --tl-ink:#ffffff; --tl-off:rgba(255,255,255,.16); --tl-case:#15171a;
  --display:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:8px 32px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.brand{font-family:var(--display);font-size:1.6rem;font-weight:700;letter-spacing:.02em}
.brand span{color:var(--accent)}
.today{font-size:.8rem;color:var(--muted);text-align:right}

.gear{border:0;background:var(--surface);color:var(--muted);width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.gear svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.optic{font-size:1.3rem;width:28px;text-align:center}
label.opt{cursor:pointer}
.plates{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 20px)/3);gap:10px;overflow-x:auto;padding:7px 6px 4px;margin:0 -6px 14px;scrollbar-width:none}
.plate{min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0}
.plate .reg{display:block;width:100%;border-radius:8px;line-height:0}
.plate-svg{display:block;width:100%;height:auto}
.pbg{fill:var(--plate);stroke:#111;stroke-width:3}
.plate .nm{font-size:.9rem;color:var(--muted);font-weight:600}
.plates[data-sel="one"] .plate[aria-pressed="false"] .reg{opacity:.5}
.plates[data-sel="one"] .plate[aria-pressed="false"] .pbg{fill:var(--plate-front)}
.plate[aria-pressed="true"] .reg{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--fg)}
.choose{padding:36px 16px;text-align:center;display:grid;gap:8px;justify-items:center}
.choose .arrow{font-size:2rem;line-height:1;color:var(--muted)}
.plate .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:1px}
.plate.add .addreg{line-height:1;font-family:var(--display);font-weight:700;font-size:1.4rem;padding:6px 0;text-align:center;background:transparent;color:var(--muted);box-shadow:inset 0 0 0 2px var(--line);opacity:1}

/* Alert banner */
.alerts{display:grid;gap:8px;margin-bottom:16px}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;font-size:.9rem}
.alert b{font-weight:700}
.alert.bad{background:var(--bad-soft);color:var(--fg)}
.alert.warn{background:var(--warn-soft);color:var(--fg)}
.alert .pip{flex:0 0 10px;height:10px;border-radius:50%;margin-top:6px}
.bad .pip{background:var(--tl-red)} .warn .pip{background:var(--tl-amber)} .soon .pip{background:var(--tl-yellow)} .ok .pip{background:var(--tl-green)}
.alert.soon{background:var(--soon-soft);color:var(--fg)}
.alerts.solid .alert{color:#fff;font-size:.95rem}
.alerts.solid .alert.ok{background:var(--tl-green)} .alerts.solid .alert.soon{background:var(--tl-yellow)} .alerts.solid .alert.warn{background:var(--tl-amber)} .alerts.solid .alert.bad{background:var(--tl-red)}
.alerts.solid .pip{background:#fff !important}
.allclear{background:var(--ok-soft)}

/* Date cards */
.dates{display:grid;gap:10px}
.dcard{background:var(--surface);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;border-left:6px solid var(--tl-green)}
.dcard.soon{border-left-color:var(--tl-yellow)} .dcard.warn{border-left-color:var(--tl-amber)} .dcard.bad{border-left-color:var(--tl-red)}
.dcard .label{font-family:var(--display);font-size:1.05rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.dcard .when{font-size:1.15rem;font-weight:700}
.dcard .left{grid-row:1/3;grid-column:2;display:flex;align-items:center;gap:10px;text-align:right;align-self:center}
.dcard .left .n{font-family:var(--display);font-size:2.3rem;font-weight:700;line-height:1}
.dcard .left .u{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.ok .left .n{color:var(--ok)} .soon .left .n{color:var(--soon)} .warn .left .n{color:var(--warn)} .bad .left .n{color:var(--bad)}
.dcard .hint{grid-column:1/-1;font-size:.85rem;color:var(--muted);margin-top:4px}
.dcard .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.dcard .bar i{display:block;height:100%;background:var(--tl-green);border-radius:3px}
.soon .bar i{background:var(--tl-yellow)} .warn .bar i{background:var(--tl-amber)} .bad .bar i{background:var(--tl-red)}
.dcard{scroll-margin-top:calc(90px + env(safe-area-inset-top,0px))}
.dcard.flash{box-shadow:0 0 0 3px var(--fg);animation:flash 1.2s ease 2}
@keyframes flash{50%{box-shadow:0 0 0 6px var(--accent)}}
.btn{text-decoration:none}
.dcard .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;font-size:.9rem;background:var(--accent-soft);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.ghost{background:transparent;color:var(--muted);padding-inline:8px}
.btn:disabled{opacity:.5;cursor:default}

.section{margin-top:22px;display:grid;gap:10px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.panel{background:var(--surface);border-radius:var(--r);padding:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.chip{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 8px}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.soon{background:var(--soon-soft);color:var(--soon)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}

.doc{display:flex;align-items:center;gap:12px}
.doc .ic{flex:0 0 42px;height:52px;border-radius:6px;background:var(--bad-soft);color:var(--bad);font-family:var(--display);font-weight:700;display:grid;place-items:center;font-size:.9rem}
.doc .meta{flex:1;min-width:0}
.doc .meta b{display:block;overflow-wrap:anywhere}
.sharebtn{flex:0 0 auto;width:44px;height:44px;border:0;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.sharebtn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sheet .opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-radius:12px;background:var(--surface-2);color:var(--fg);padding:12px;text-decoration:none;font-weight:600}
.sheet .opt small{display:block;color:var(--muted);font-weight:500}

/* Contacts */
.contact{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.contact:first-child{border-top:0;padding-top:0}
.contact .who{flex:1;min-width:0}
.contact .who b{display:block;font-size:.95rem}
.contact .tel{font-family:var(--display);font-size:1.3rem;font-weight:600;letter-spacing:.03em;user-select:all}
.contact .tel a{color:var(--fg);text-decoration:none}
.iconbtn{border:0;background:var(--accent-soft);color:var(--accent);border-radius:10px;height:40px;min-width:40px;padding:0 10px;font-weight:600;font-size:.82rem}

/* Costs */
.totals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:var(--r);padding:12px 14px}
.tile .v{font-family:var(--display);font-size:1.9rem;font-weight:700;line-height:1.1}
.tile .k{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.cats{display:grid;gap:8px}
.cat{display:grid;grid-template-columns:7.5rem 1fr auto;gap:10px;align-items:center;font-size:.88rem}
.cat .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.cat .track i{display:block;height:100%;background:var(--accent);border-radius:5px}
.entry{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry .amt{font-weight:700;text-align:right}
.entry .sub{font-size:.8rem;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.entry .del{grid-column:2;justify-self:end}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* Forms */
form.grid{display:grid;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:grid;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px;font-size:16px;color:var(--fg);width:100%;min-width:0}
.checkrow{display:flex;gap:8px;align-items:center;font-size:.9rem}

/* Guide */
.guide ol{margin:0;padding-left:1.3rem;display:grid;gap:10px}
.guide li{padding-left:4px}
.guide li b{display:block}

<script>
/* Car Status — on-phone storage. Everything (cars, costs, accident reports, PDFs, photos)
   lives in this phone's IndexedDB. Back up / Restore moves it to and from a single .json file. */
(function(){
  const DBN = "car-status", VER = 1;
  let idb = null;
  const FILES = {};                       // asset id -> object URL
  window.blobUrl = id => FILES[id] || "#";
  function open(){
    if (idb) return Promise.resolve(idb);
    return new Promise((res, rej) => {
      const r = indexedDB.open(DBN, VER);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains("docs")) d.createObjectStore("docs", {keyPath:"path"}).createIndex("col","col");
        if (!d.objectStoreNames.contains("files")) d.createObjectStore("files", {keyPath:"id"});
        if (!d.objectStoreNames.contains("meta")) d.createObjectStore("meta", {keyPath:"k"});
      };
      r.onsuccess = () => { idb = r.result; res(idb); };
      r.onerror = () => rej(r.error);
    });
  }
  function tx(store, mode, fn){
    return open().then(d => new Promise((res, rej) => {
      const t = d.transaction(store, mode), s = t.objectStore(store); let out;
      Promise.resolve(fn(s)).then(v => out = v);
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    }));
  }
  const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const clone = o => JSON.parse(JSON.stringify(o));
  function merge(a, b){
    const out = Array.isArray(a) ? a.slice() : {...(a||{})};
    for (const [k,v] of Object.entries(b)){
      if (v && typeof v==="object" && !Array.isArray(v) && out[k] && typeof out[k]==="object" && !Array.isArray(out[k])) out[k] = merge(out[k], v);
      else out[k] = v;
    }
    return out;
  }
  const listeners = {};
  async function colDocs(col){
    const rows = await tx("docs","readonly", s => req(s.index("col").getAll(col)));
    return rows.map(r => ({id:r.id, exists:true, data:() => r.data, metadata:{fromCache:false,hasPendingWrites:false}}));
  }
  async function notify(col){
    const docs = await colDocs(col);
    (listeners[col]||new Set()).forEach(fn => { try{ fn({docs, size:docs.length, empty:!docs.length, docChanges:()=>[]}); }catch(e){ console.error(e); } });
    window.dispatchEvent(new Event("cs-changed"));
  }
  const rid = () => Array.from(crypto.getRandomValues(new Uint8Array(10)), b => b.toString(16).padStart(2,"0")).join("");
  function docRef(path){
    const parts = path.split("/"), id = parts.pop(), col = parts.join("/");
    return {
      id, path,
      async get(){ const r = await tx("docs","readonly", s => req(s.get(path))); return {id, exists:!!r, data:() => r ? r.data : undefined}; },
      async set(data){ await tx("docs","readwrite", s => s.put({path, col, id, data:clone(data)})); await markChanged(); notify(col); },
      async update(data){
        const r = await tx("docs","readonly", s => req(s.get(path)));
        if (!r) throw {code:"invalid_argument", message:"Document doesn't exist"};
        await tx("docs","readwrite", s => s.put({path, col, id, data:merge(r.data, clone(data))})); await markChanged(); notify(col);
      },
      async delete(){ await tx("docs","readwrite", s => s.delete(path)); await markChanged(); notify(col); },
    };
  }
  function colRef(col){
    return {
      path: col,
      doc: id => docRef(col+"/"+(id||rid())),
      async add(data){ const d = docRef(col+"/"+rid()); await d.set(data); return d; },
      onSnapshot(fn){ (listeners[col] ||= new Set()).add(fn); colDocs(col).then(docs => fn({docs, size:docs.length, empty:!docs.length, docChanges:()=>[]})); return () => listeners[col].delete(fn); },
      async get(){ const docs = await colDocs(col); return {docs, size:docs.length, empty:!docs.length}; },
    };
  }
  const db = { doc: docRef, collection: colRef };

  async function loadFiles(){
    const all = await tx("files","readonly", s => req(s.getAll()));
    all.forEach(f => { if (!FILES[f.id]) FILES[f.id] = URL.createObjectURL(f.blob); });
  }
  const assets = {
    async upload(blob){
      const id = rid()+rid().slice(0,12);
      const type = blob.type || "application/octet-stream";
      await tx("files","readwrite", s => s.put({id, name:blob.name||id, type, blob}));
      FILES[id] = URL.createObjectURL(blob); await markChanged();
      return {id, url:FILES[id], sizeBytes:blob.size, contentType:type};
    },
    async delete(id){ await tx("files","readwrite", s => s.delete(id)); if (FILES[id]) URL.revokeObjectURL(FILES[id]); delete FILES[id]; },
    async list(){ const all = await tx("files","readonly", s => req(s.getAll())); return {assets: all.map(f=>({id:f.id, url:FILES[f.id], sizeBytes:f.blob.size, contentType:f.type}))}; },
  };
  async function saveFile(filename, data, type){
    const blob = data instanceof Blob ? data : new Blob([data], {type: type || "application/octet-stream"});
    const file = new File([blob], filename, {type: blob.type || type || "application/octet-stream"});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:filename}); return; }
      catch(e){ if (e && e.name==="AbortError") throw {code:"declined"}; }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }
  const downloads = { save: ({filename, data}) => saveFile(filename, data) };

  // ---- meta, backup and restore ----
  async function getMeta(k){ const r = await tx("meta","readonly", s => req(s.get(k))); return r ? r.v : null; }
  async function setMeta(k, v){ await tx("meta","readwrite", s => s.put({k, v})); }
  async function markChanged(){ await setMeta("changedAt", new Date().toISOString()); }
  const toB64 = blob => new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.readAsDataURL(blob); });
  const fromB64 = (b64, type) => { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return new Blob([u], {type}); };
  async function exportBackup(){
    const docs = await tx("docs","readonly", s => req(s.getAll()));
    const files = await tx("files","readonly", s => req(s.getAll()));
    const out = {app:"car-status", version:1, exportedAt:new Date().toISOString(),
      docs: docs.map(d => ({path:d.path, data:d.data})),
      files: await Promise.all(files.map(async f => ({id:f.id, name:f.name, type:f.type, b64: await toB64(f.blob)})))};
    const name = "car-status-backup-"+new Date().toISOString().slice(0,10)+".json";
    await saveFile(name, new Blob([JSON.stringify(out)], {type:"application/json"}));
    await setMeta("backedUpAt", new Date().toISOString());
  }
  async function importBackup(file){
    const j = JSON.parse(await file.text());
    if (j.app!=="car-status" || !Array.isArray(j.docs)) throw new Error("This isn't a Car Status backup file.");
    await tx("docs","readwrite", s => { s.clear(); j.docs.forEach(d => { const p = d.path.split("/"), id = p.pop(); s.put({path:d.path, col:p.join("/"), id, data:d.data}); }); });
    await tx("files","readwrite", s => { s.clear(); (j.files||[]).forEach(f => s.put({id:f.id, name:f.name, type:f.type, blob:fromB64(f.b64, f.type)})); });
    await setMeta("backedUpAt", j.exportedAt || new Date().toISOString());
  }
  window.CarStore = { exportBackup, importBackup, getMeta, saveFile,
    persist: () => navigator.storage && navigator.storage.persist ? navigator.storage.persist() : Promise.resolve(false) };

  const ready = open().then(loadFiles).catch(e => console.error(e));
  window.claude = { use: async name => { await ready; return ({db, assets, downloads})[name] || null; } };
})();

</script>
<script>
(function(){
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MS = 86400000;
const CATS = ["Fuel","Insurance","Tax","MOT","Service & repairs","Breakdown","Parking & tolls","Other"];

const state = { accidents: [], accEditId: null, accRev: 0, highlight: null, cars: [], costs: [], carId: null, tab: "summary", helpOpen: "breakdown", costRange: "12m", db: null, assets: null, confirmDel: null, loaded: false, offline: false };

/* ---------- dates ---------- */
function todayLocal(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function parse(iso){ if(!iso) return null; const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d); }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmt(iso_, opts){ const d = parse(iso_); return d ? d.toLocaleDateString("en-GB", opts || {day:"numeric",month:"short",year:"numeric"}) : "Not set"; }
function daysLeft(iso_){ const d = parse(iso_); return d ? Math.round((d - todayLocal())/MS) : null; }
function addMonths(iso_, n){ const d = parse(iso_); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day,last)); return iso(d); }
function level(n, iso_){
  if(n===null) return "unset";
  if(n<0) return "bad";
  const t = iso(todayLocal());
  if (iso_ ? t >= addMonths(iso_,-1) : n<=30) return "warn";
  if (iso_ ? t >= addMonths(iso_,-2) : n<=60) return "soon";
  return "ok";
}
const LVL_TXT = {ok:"More than 2 months", soon:"Under 2 months", warn:"Under 1 month", bad:"Overdue", unset:"Not set"};
function tl(lv, big){ return `<span class="tl${big?" big":""}" role="img" aria-label="${LVL_TXT[lv]}"><i class="r${lv==="bad"?" on":""}"></i><i class="a${lv==="warn"?" on":""}"></i><i class="y${lv==="soon"?" on":""}"></i><i class="g${lv==="ok"?" on":""}"></i></span>`; }
function money(n){ return "£" + Number(n||0).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2}); }
/* UK number-plate lettering drawn as strokes on the DVLA grid: 79 mm characters, 50 mm wide, 14 mm stroke, 11 mm spacing, 33 mm group gap, on a 520 × 111 mm plate. */

};
function plateSVG(reg){
  const s = String(reg||"").toUpperCase().replace(/[^A-Z0-9 ]/g,"").trim();
  const parts = s.includes(" ") ? s.split(/\s+/) : (s.length===7 ? [s.slice(0,4), s.slice(4)] : [s]);
  let x = 0, paths = "";
  parts.forEach((p,pi) => { if (pi) x += 33 - 11; [...p].forEach(ch => { if (G[ch]) paths += `<path transform="translate(${x} 0)" clip-path="url(#pgc)" d="${G[ch]}"/>`; x += 61; }); });
  const tw = Math.max(0, x - 11), W = Math.max(520, tw + 60), ox = (W - tw)/2;
  return `<svg class="plate-svg" viewBox="0 0 ${W} 111" role="img" aria-label="${s}"><defs><clipPath id="pgc" clipPathUnits="userSpaceOnUse"><rect x="-2" y="0" width="54" height="79"/></clipPath></defs><rect class="pbg" x="1.5" y="1.5" width="${W-3}" height="108" rx="12"/><g transform="translate(${ox} 16)" fill="none" stroke="#111" stroke-width="14" stroke-linejoin="miter" stroke-miterlimit="2.5" stroke-linecap="butt">${paths}</g></svg>`;
}


function plate(r){ const s = String(r||"").replace(/\s+/g,"").toUpperCase(); return s.length===7 ? s.slice(0,4)+" "+s.slice(4) : s; }
$("#today").textContent = new Date().toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"long"});

function items(car){
  const ins = car.insurance || {};
  return [
    { key:"mot", label:"MOT", date: car.mot, cycle:12 },
    { key:"tax", label:"Road tax", date: car.tax, cycle:12 },
    { key:"insurance", label:"Insurance", date: ins.renewal, cycle:12 },
  ];
}
function hint(car, it){
  const n = daysLeft(it.date);
  if (it.key==="mot"){
    if (n!==null && n<0) return "MOT has expired. It's illegal to drive except to a pre-booked MOT test.";
    const early = addMonths(it.date,-1); const e = parse(early); e.setDate(e.getDate()+1);
    return "Book from " + fmt(iso(e)) + " and you keep the same renewal date.";
  }
  if (it.key==="tax"){
    if (n!==null && n<0) return "Tax has run out. Tax it at gov.uk/vehicle-tax before driving.";
    return "Renew at gov.uk/vehicle-tax. Reminder letter (V11) usually arrives a few weeks before.";
  }
  const ins = car.insurance || {};
  if (n!==null && n<0) return "Cover has lapsed. Don't drive until the car is insured.";
  return ins.autoRenew
    ? (ins.insurer||"Insurer") + " will auto-renew. Compare quotes before then if you want to switch."
    : "Does NOT auto-renew. Arrange cover with " + (ins.insurer||"your insurer") + " or a new insurer before this date.";
}
function allAlerts(){
  const out = [];
  state.cars.forEach(car => items(car).forEach(it => {
    const n = daysLeft(it.date); if (n===null) return;
    const lv = level(n, it.date); if (lv!=="ok" && lv!=="unset") out.push({car, it, n, lv});
  }));
  return out.sort((a,b)=>a.n-b.n);
}
function carLevel(car){ const ls = items(car).map(it=>level(daysLeft(it.date), it.date)); return ["bad","warn","soon"].find(l=>ls.includes(l)) || "ok"; }
function when(n){ return n<0 ? Math.abs(n)+" day"+(Math.abs(n)===1?"":"s")+" overdue" : n===0 ? "today" : n===1 ? "tomorrow" : "in "+n+" days"; }

/* ---------- render ---------- */
function car(){ return state.cars.find(c=>c.id===state.carId) || state.cars[0]; }

function platesHTML(opt={}){
  const dotColor = {ok:"var(--tl-green)",soon:"var(--tl-yellow)",warn:"var(--tl-amber)",bad:"var(--tl-red)"};
  return state.cars.map(c => `<button class="plate" data-car="${esc(c.id)}" aria-pressed="${c.id===state.carId}">
      <span class="reg">${plateSVG(plate(c.reg))}</span>
      <span class="nm"><span class="dot" style="background:${dotColor[carLevel(c)]}"></span>${esc(c.name)}</span></button>`).join("")
    + (state.db && !opt.noAdd ? `<button class="plate add" data-act="addcar" aria-label="Add a car"><span class="reg addreg">+</span><span class="nm">Add car</span></button>` : "");
}
function renderPlates(){
  const el = $("#plates");
  el.hidden = state.tab==="summary" || !state.cars.length;
  el.dataset.sel = state.carId ? "one" : "none";
  el.innerHTML = el.hidden ? "" : platesHTML();
}

function renderBadge(){
  const n = allAlerts().filter(a=>a.lv==="bad"||a.lv==="warn").length, b = $("#badge");
  b.hidden = !n; b.textContent = n;
}

function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===state.tab)));
  renderPlates(); renderBadge();
  const v = $("#view");
  if (!state.cars.length){
    v.innerHTML = state.offline
      ? `<div class="empty"><h3>Storage isn't available</h3><p>Open Car Status from your Home Screen icon, not a private Safari tab.</p></div>`
      : state.loaded ? `<div class="empty" style="display:grid;gap:12px;justify-items:center"><h3>Welcome to Car Status</h3><p style="margin:0">Restore your backup file to load your cars, policies and costs.</p><label class="btn primary big" for="restoreFirst" style="max-width:280px;width:100%">Restore from backup<input type="file" id="restoreFirst" accept=".json,application/json" hidden></label><button class="btn" data-act="addcar">Or add a car by hand</button></div>`
      : `<div class="empty">Loading your cars…</div>`;
    return;
  }
  const views = {summary:viewSummary, dates:viewDates, contacts:viewContacts, accident:viewAccident, breakdown:viewBreakdown};
  if (!views[state.tab]) state.tab = "summary";
  if (state.tab!=="summary" && !state.cars.some(c=>c.id===state.carId)){
    v.dataset.key = "";
    v.innerHTML = `<div class="choose"><div class="arrow">↑</div><h2>Choose a car</h2><p class="muted" style="margin:0">Tap a reg plate above to see its ${({dates:"details",contacts:"contacts",accident:"accident help",breakdown:"breakdown help"})[state.tab]}.</p></div>`;
    return;
  }
  if (state.tab==="breakdown"){
    const key = "bd|"+car().id+"|"+state.accRev;
    if (v.dataset.key===key) return;
    v.dataset.key = key; v.innerHTML = viewBreakdown(); return;
  }
  if (state.tab==="accident"){
    // Don't rebuild the form while someone is typing; rebuild only when the car or saved reports change
    const key = "acc|"+car().id+"|"+state.accidents.filter(a=>a.carId===car().id).map(a=>a.id+":"+(a.savedAt||"")).join(",")+"|"+(state.accEditId||"")+"|"+state.accRev;
    if (v.dataset.key===key) return;
    v.dataset.key = key; v.innerHTML = viewAccident(); return;
  }
  v.dataset.key = "";
  v.innerHTML = views[state.tab]();
}

function viewSummary(){
  const cars = state.cars;
  const rows = [["mot","MOT"],["tax","Road Tax"],["insurance","Insurance"]];
  const dotColor = {ok:"var(--tl-green)",soon:"var(--tl-yellow)",warn:"var(--tl-amber)",bad:"var(--tl-red)"};
  const cols = cars.map(c => `<button class="plate" data-car="${esc(c.id)}" aria-pressed="${c.id===state.carId}"><span class="reg">${plateSVG(plate(c.reg))}</span><span class="nm"><span class="dot" style="background:${dotColor[carLevel(c)]}"></span>${esc(c.name)}</span></button>` + rows.map(([key,label]) => {
      const it = items(c).find(i=>i.key===key), n = daysLeft(it.date), lv = level(n, it.date);
      const ins = c.insurance||{};
      const tail = n===null ? "No date yet" : n<0 ? when(n) : n===0 ? "Due today" : n+" day"+(n===1?"":"s")+" to go";
      const sub = key==="insurance" ? `${esc(ins.insurer||"")}${ins.insurer?" · ":""}${ins.autoRenew?"Auto-renew":"Manual"}` : "";
      const link = key==="mot" ? "https://www.gov.uk/check-mot-status" : key==="tax" ? "https://www.gov.uk/check-vehicle-tax" : "";
      return `<div class="cell ${lv}${link?" has-link":""}">
        <button class="cell-main" data-car="${esc(c.id)}" data-goto="dates" data-key="${key}" aria-label="${esc(c.name)} ${label}: ${it.date?fmt(it.date):"not set"}, ${LVL_TXT[lv]}. Open details. Press and hold to change the date.">
          <span class="lb">${label}</span>
          <span class="d">${it.date?`<span>${fmt(it.date,{day:"numeric",month:"short"}).replace("Sept","Sep")}</span><span>${parse(it.date).getFullYear()}</span>`:"Not set"}</span>
          <span class="s">${tail}</span>${sub?`<span class="s">${sub}</span>`:""}
        </button>
        ${link?`<a class="cell-link" href="${link}" target="_blank" rel="noopener" data-copyreg="${esc(c.reg)}" aria-label="Check ${label} status on GOV.UK for ${esc(plate(c.reg))}"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span>Check</span></a>`:""}
        ${state.db?`<button class="cell-edit" data-act="editfor" data-car="${esc(c.id)}" data-key="${key}"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>Update</button>`:""}
      </div>`;
    }).join("")).join("");
  const ic = {acc:'<svg viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3zM12 10v4M12 17.5v.01"/></svg>', bd:'<svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>'};
  const al = allAlerts();
  return `
  <section class="section" style="margin-top:0"><h3>Coming up</h3><div class="alerts solid" style="margin:0">${
    al.length ? al.map(a => `<div class="alert ${a.lv}"><span class="pip"></span><div><b>${esc(a.car.name)} ${esc(a.it.label)}</b> ${a.n<0?"was due":"due"} ${esc(when(a.n))} · ${fmt(a.it.date)}</div></div>`).join("")
    : `<div class="alert ok"><span class="pip"></span><div><b>All clear.</b> Nothing due in the next 2 months.</div></div>`}</div></section>
  ${state.db?`<button class="addcar-btn" data-act="addcar">+ Add car</button>`:""}
  <section aria-label="Key dates" class="cols" style="grid-template-columns:repeat(${cars.length},minmax(0,1fr))">${cols}</section>
  <p class="small muted" style="margin:10px 2px 0">Tap a date for full details. <b>Update</b> changes the date. <b>Check</b> opens GOV.UK with your reg copied, ready to paste.</p>
  <div class="legend" aria-label="Key">
    <span><b style="background:var(--tl-green)"></b>More than 2 months</span>
    <span><b style="background:var(--tl-yellow)"></b>2 months to go</span>
    <span><b style="background:var(--tl-amber)"></b>1 month to go</span>
    <span><b style="background:var(--tl-red)"></b>Late</span>
  </div>
  <div class="sos-row">
    <button class="sos-btn acc" data-help="accident">${ic.acc}<span><small>What to do if</small>Accident</span></button>
    <button class="sos-btn bd" data-help="breakdown">${ic.bd}<span><small>What to do if</small>Breakdown</span></button>
  </div>`;
}

function viewDates(){
  const c = car(), ins = c.insurance || {};
  const al = allAlerts();
  const alerts = al.length
    ? al.map(a => `<div class="alert ${a.lv}"><span class="pip"></span><div><b>${esc(a.car.name)} ${esc(a.it.label)}</b> due ${esc(when(a.n))} · ${fmt(a.it.date)}</div></div>`).join("")
    : `<div class="alert allclear ok"><span class="pip"></span><div><b>All clear.</b> Nothing due in the next 2 months on any car.</div></div>`;
  const cards = items(c).map(it => {
    const n = daysLeft(it.date), lv = level(n, it.date);
    const pct = n===null ? 0 : Math.max(0, Math.min(100, n/365*100));
    const chk = it.key==="mot" ? "https://www.gov.uk/check-mot-status" : it.key==="tax" ? "https://www.gov.uk/check-vehicle-tax" : "";
    return `<article class="dcard ${lv}${state.highlight===it.key?" flash":""}" id="card-${it.key}">
      <div class="label">${esc(it.label)}</div>
      <div class="left">${tl(lv,true)}<div><div class="n num">${n===null?"–":n<0?"!":n}</div><div class="u">${n===null?"not set":n<0?"overdue":n===1?"day left":"days left"}</div></div></div>
      <div class="when num">${fmt(it.date,{weekday:"short",day:"numeric",month:"long",year:"numeric"})}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="hint">${esc(hint(c,it))}</div>
      ${state.db ? `<div class="acts"><button class="btn" data-act="renew" data-key="${it.key}">Mark renewed</button><button class="btn ghost" data-act="editdate" data-key="${it.key}">Change date</button>${chk?`<a class="btn" href="${chk}" target="_blank" rel="noopener" data-copyreg="${esc(c.reg)}">Check on GOV.UK ↗</a>`:""}</div>` : ""}
    </article>`;
  }).join("");
  const pol = c.policy;
  return `
  <section class="alerts" aria-label="Alerts">${alerts}</section>
  <div class="section-h" style="margin-bottom:10px"><h2>${esc(c.name)}</h2><span class="muted small">${esc(c.model||"")}</span></div>
  <div class="dates">${cards}</div>

  <section class="section">
    <div class="section-h"><h3>Insurance</h3>${state.db?`<button class="btn ghost" data-act="editcar">Edit details</button>`:""}</div>
    <div class="panel"><dl class="kv num">
      <dt>Insurer</dt><dd>${esc(ins.insurer||"–")}</dd>
      <dt>Policy no.</dt><dd style="user-select:all">${esc(ins.policyNo||"–")}</dd>
      <dt>Premium</dt><dd>${ins.premium?money(ins.premium)+" / yr":"–"}</dd>
      <dt>Auto-renew</dt><dd>${ins.autoRenew?'<span class="chip ok">Yes</span>':'<span class="chip warn">No</span>'}</dd>
      <dt>Breakdown cover</dt><dd>${c.breakdownCover?'<span class="chip ok">Included</span>':'<span class="chip bad">None</span>'}</dd>
      ${ins.cover?`<dt>Cover</dt><dd>${esc(ins.cover)}</dd>`:""}
      ${ins.excess?`<dt>Excess</dt><dd>${esc(ins.excess)}</dd>`:""}
      ${ins.drivers?`<dt>Drivers</dt><dd>${esc(ins.drivers)}</dd>`:""}
    </dl></div>
  </section>

  <section class="section">
    <h3>Policy documents</h3>
    <div class="panel doc">
      <div class="ic">PDF</div>
      <div class="meta">${pol&&pol.assetId
        ? `<b>${esc(pol.name||"Policy document")}</b><span class="muted small">Added ${fmt(pol.added)}</span>`
        : `<b>No policy saved</b><span class="muted small">Add your latest schedule or certificate.</span>`}</div>
      ${pol&&pol.assetId?`<a class="btn primary" href="${blobUrl(pol.assetId)}" target="_blank" rel="noopener">Open</a>
        <button class="sharebtn" data-act="share" aria-label="Send policy document"><svg viewBox="0 0 24 24"><path d="M8.5 9.5H6.5a1.5 1.5 0 0 0-1.5 1.5v8.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V11a1.5 1.5 0 0 0-1.5-1.5h-2M12 14V3M8 6.8 12 3l4 3.8"/></svg></button>`:""}
    </div>
    ${state.assets?`<label class="btn" style="justify-self:start">${pol&&pol.assetId?"Replace document":"Upload document"}<input type="file" id="polfile" accept="application/pdf,image/*" hidden></label>`:""}
  </section>
  ${viewCosts()}`;
}

function inRange(d){
  if (state.costRange==="all") return true;
  const t = todayLocal();
  if (state.costRange==="year") return parse(d).getFullYear()===t.getFullYear();
  const from = new Date(t); from.setFullYear(from.getFullYear()-1); return parse(d) > from;
}
function viewCosts(){
  const c = car();
  const list = state.costs.filter(x=>x.carId===c.id && inRange(x.date)).sort((a,b)=>b.date.localeCompare(a.date));
  const total = list.reduce((s,x)=>s+Number(x.amount||0),0);
  const byCat = {}; list.forEach(x=>byCat[x.category]=(byCat[x.category]||0)+Number(x.amount||0));
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const max = cats.length?cats[0][1]:1;
  const months = state.costRange==="12m"?12:state.costRange==="year"?(todayLocal().getMonth()+1):null;
  const allCars = state.costs.filter(x=>inRange(x.date)).reduce((s,x)=>s+Number(x.amount||0),0);
  const rangeLbl = {"12m":"Last 12 months","year":"This year","all":"All time"}[state.costRange];
  return `
  <div class="section-h" style="margin:26px 0 10px"><h2>${esc(c.name)} costs <span class="muted small" style="font-family:var(--body);font-weight:600">${esc(plate(c.reg))}</span></h2>${state.db?`<button class="btn primary" data-act="addcost">+ Add cost</button>`:""}</div>
  <div class="seg" role="group" aria-label="Period" style="margin-bottom:12px">
    ${[["12m","12 months"],["year","This year"],["all","All time"]].map(([k,l])=>`<button data-range="${k}" aria-pressed="${state.costRange===k}">${l}</button>`).join("")}
  </div>
  <div class="totals">
    <div class="tile"><div class="k">${rangeLbl}</div><div class="v num">${money(total)}</div></div>
    <div class="tile"><div class="k">${months?"Per month":"All cars"}</div><div class="v num">${months?money(total/months):money(allCars)}</div></div>
  </div>
  ${cats.length?`<section class="section"><h3>By category</h3><div class="panel cats">
    ${cats.map(([k,v])=>`<div class="cat"><span>${esc(k)}</span><span class="track"><i style="width:${Math.max(3,v/max*100)}%"></i></span><span class="num">${money(v)}</span></div>`).join("")}
  </div></section>`:""}
  <section class="section"><h3>Entries</h3><div class="panel">
    ${list.length?list.map(x=>`<div class="entry">
      <div><b>${esc(x.category)}</b><div class="sub">${fmt(x.date)}${x.note?" · "+esc(x.note):""}</div></div>
      <div class="amt num">${money(x.amount)}</div>
      ${state.db?(state.confirmDel===x.id
        ? `<div class="del" style="grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end"><span class="small muted" style="align-self:center">Delete this entry?</span><button class="btn danger" data-act="delyes" data-id="${esc(x.id)}">Delete</button><button class="btn ghost" data-act="delno">Keep</button></div>`
        : `<button class="btn ghost del small" data-act="del" data-id="${esc(x.id)}">Remove</button>`):""}
    </div>`).join(""):`<div class="empty">No costs logged in this period. Tap “Add cost” to record fuel, servicing, parking and more.</div>`}
  </div></section>`;
}

    async fd => { const list = (car().contacts||[]).slice(); list.push({label:fd.get("label"), number:fd.get("number"), note:fd.get("note")||""}); await carRef().update({contacts:list}); toast("Contact added"); });
}
function sheetEditContacts(){
  const list = car().contacts||[];
  openSheet(`<h3>Edit contacts</h3>${list.map((k,i)=>`<div class="panel" style="background:var(--surface-2);display:grid;gap:8px">
      <label class="f">Name<input type="text" id="f-el${i}" name="l${i}" value="${esc(k.label)}"></label>
      <label class="f">Number<input type="tel" id="f-en${i}" name="n${i}" value="${esc(k.number)}"></label>
      <label class="checkrow"><input type="checkbox" id="f-ed${i}" name="d${i}"> Remove this contact</label></div>`).join("")}`,
    async fd => { const out=[]; list.forEach((k,i)=>{ if(!fd.get("d"+i)) out.push({...k, label:fd.get("l"+i), number:fd.get("n"+i)}); }); await carRef().update({contacts:out}); toast("Contacts saved"); });
}
function sheetCar(isNew){
  const c = isNew ? {insurance:{}} : car(), ins = c.insurance||{};
  openSheet(`<h3>${isNew?"Add a car":"Edit "+esc(c.name)}</h3>
    <div class="row2"><label class="f">Name<input type="text" id="f-name" name="name" value="${esc(c.name||"")}" required placeholder="e.g. Skoda"></label>
    <label class="f">Reg<input type="text" id="f-reg" name="reg" value="${esc(c.reg||"")}" required style="text-transform:uppercase"></label></div>
    <label class="f">Model<input type="text" id="f-model" name="model" value="${esc(c.model||"")}"></label>
    ${isNew?`<div class="row2"><label class="f">MOT due<input type="date" id="f-mot" name="mot"></label><label class="f">Tax due<input type="date" id="f-tax" name="tax"></label></div>
      <label class="f">Insurance renewal<input type="date" id="f-ren" name="renewal"></label>`:""}
    <div class="row2"><label class="f">Insurer<input type="text" id="f-ins" name="insurer" value="${esc(ins.insurer||"")}"></label>
    <label class="f">Policy no.<input type="text" id="f-pol" name="policyNo" value="${esc(ins.policyNo||"")}"></label></div>
    <div class="row2"><label class="f">Premium (£/yr)<input type="number" id="f-prem" name="premium" step="0.01" value="${esc(ins.premium||"")}"></label>
    <label class="f">Excess<input type="text" id="f-exc" name="excess" value="${esc(ins.excess||"")}"></label></div>
    <label class="checkrow"><input type="checkbox" id="f-auto" name="autoRenew" ${ins.autoRenew?"checked":""}> Insurance auto-renews</label>
    <label class="checkrow"><input type="checkbox" id="f-bd" name="breakdownCover" ${c.breakdownCover?"checked":""}> Breakdown cover included</label>`,
    async fd => {
      const insurance = {insurer:fd.get("insurer"), policyNo:fd.get("policyNo"), premium:parseFloat(fd.get("premium"))||0, excess:fd.get("excess"), autoRenew:!!fd.get("autoRenew")};
      const base = {name:fd.get("name"), reg:String(fd.get("reg")).toUpperCase().replace(/\s+/g,""), model:fd.get("model"), breakdownCover:!!fd.get("breakdownCover")};
      if (isNew){
        insurance.renewal = fd.get("renewal")||"";
        const id = base.reg.toLowerCase().replace(/[^a-z0-9]/g,"") || ("car"+Date.now());
        await state.db.doc("cars/"+id).set({...base, mot:fd.get("mot")||"", tax:fd.get("tax")||"", insurance, contacts:[], order:state.cars.length+1});
        state.carId = id; toast("Car added");
      } else { await carRef().update({...base, insurance}); toast("Details saved"); }
    });
}

/* ---------- long press on summary tiles to edit ---------- */
let holdTimer = null, holdEl = null, suppressClick = false, holdStart = null;
function cancelHold(){ clearTimeout(holdTimer); holdTimer = null; if (holdEl) holdEl.classList.remove("holding"); holdEl = null; }
document.addEventListener("pointerdown", e => {
  const cell = e.target.closest(".cell-main[data-key]"); if (!cell || !state.db) return;
  cancelHold(); holdEl = cell; holdStart = [e.clientX, e.clientY]; cell.classList.add("holding");
  holdTimer = setTimeout(() => {
    suppressClick = true; const key = cell.dataset.key; state.carId = cell.dataset.car;
    try{localStorage.setItem("cs.car",state.carId)}catch(_){}
    cancelHold(); if (navigator.vibrate) try{navigator.vibrate(20)}catch(_){}
    sheetDate(key);
  }, 550);
});
document.addEventListener("pointermove", e => { if (holdTimer && holdStart && Math.hypot(e.clientX-holdStart[0], e.clientY-holdStart[1]) > 10) cancelHold(); });
["pointerup","pointercancel","scroll"].forEach(ev => document.addEventListener(ev, () => { if (holdTimer) cancelHold(); }, true));
document.addEventListener("contextmenu", e => { if (e.target.closest(".cell-main")) e.preventDefault(); });
document.addEventListener("click", e => { if (suppressClick){ suppressClick = false; e.stopImmediatePropagation(); e.preventDefault(); } }, true);

/* ---------- share policy ---------- */
async function policyBlob(c){ const r = await fetch(blobUrl(c.policy.assetId)); if (!r.ok) throw new Error("fetch"); return r.blob(); }
function policyFilename(c){ return (c.name+"_"+String(c.reg).replace(/\s/g,"")+"_policy.pdf").replace(/[^\w.\-]/g,"_"); }
function mailtoFor(c){
  const ins = c.insurance||{};
  const body = [c.name+" "+plate(c.reg)+(c.model?" ("+c.model+")":""), "Insurer: "+(ins.insurer||"-"), "Policy no: "+(ins.policyNo||"-"), "Renewal: "+fmt(ins.renewal),
    ...(c.contacts||[]).map(k=>k.label+": "+k.number), "", "Policy document attached."].join("\n");
  return "mailto:?subject="+encodeURIComponent(c.name+" "+plate(c.reg)+" insurance policy")+"&body="+encodeURIComponent(body);
}
async function sharePolicy(){
  const c = car();
  // 1) Native share sheet with the PDF attached, where the phone allows it
  try{
    if (navigator.canShare){
      const blob = await policyBlob(c);
      const file = new File([blob], policyFilename(c), {type:"application/pdf"});
      if (navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:c.name+" policy", text:c.name+" "+plate(c.reg)+" insurance policy"}); return; }
    }
  }catch(err){ if (err && err.name==="AbortError") return; }
  // 2) Fallback: save the PDF, then email
  const dl = await window.claude.use("downloads");
  openSheet(`<h3>Send ${esc(c.name)} policy</h3>
    <p class="small muted" style="margin:0">Your phone doesn't let this page attach files directly. Save the PDF first, then attach it in Mail.</p>
    ${dl?`<button type="button" class="opt" data-act="savepdf"><span style="font-size:1.4rem">1</span><span>Save PDF to phone<small>${esc(policyFilename(c))}</small></span></button>`:""}
    <a class="opt" href="${mailtoFor(c)}"><span style="font-size:1.4rem">${dl?"2":"✉"}</span><span>Open email<small>Policy details filled in. Tap attach and choose the saved PDF.</small></span></a>`, async()=>{});
  const save = $("#sheetSave"); if (save) save.hidden = true;
}
async function savePolicy(){
  const c = car();
  try{ const dl = await window.claude.use("downloads"); const blob = await policyBlob(c); await dl.save({filename:policyFilename(c), data:blob}); toast("Saved. Now tap Open email"); }
  catch(err){ if (err && err.code==="declined") return; toast("Couldn't save the PDF. Use Open instead and share from there."); }
}

/* ---------- breakdown location events ---------- */
let locTimer = null;
document.addEventListener("input", e => {
  if (!e.target.closest("#locForm")) return;
  clearTimeout(locTimer); locTimer = setTimeout(() => { try{ localStorage.setItem("cs.loc", JSON.stringify(readLoc())); }catch(_){} }, 300);
});
function findMe(){
  if (!navigator.geolocation){ toast("Location isn't available here. Use Open Maps."); return; }
  toast("Finding you…");
  navigator.geolocation.getCurrentPosition(pos => {
    const co = pos.coords.latitude.toFixed(5)+", "+pos.coords.longitude.toFixed(5);
    const f = $("#locForm"); if (f) f.dataset.coords = co;
    try{ localStorage.setItem("cs.loc", JSON.stringify(readLoc())); }catch(_){}
    const o = $("#coordsOut"); if (o) o.innerHTML = `<div class="small" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span class="num">GPS <b style="user-select:all">${co}</b> (±${Math.round(pos.coords.accuracy)} m)</span><a href="https://maps.apple.com/?ll=${co.replace(/\s/g,"")}&q=My%20car" target="_blank" rel="noopener">Show in Maps ↗</a></div>`;
    toast("Found you. Looking up the road…");
    lookupAddress(pos.coords.latitude, pos.coords.longitude).then(ad => {
      if (!ad){ toast("No signal for the address. Tap Open Maps and use the blue dot."); return; }
      const f2 = $("#locForm"); if (!f2) return;
      [["road",ad.road],["roadno",ad.roadno],["postcode",ad.postcode]].forEach(([k,v]) => { if (v && f2.elements["loc-"+k]) f2.elements["loc-"+k].value = v; });
      try{ localStorage.setItem("cs.loc", JSON.stringify(readLoc())); }catch(_){}
      toast(ad.road ? "Found: "+ad.road+(ad.postcode?" · "+ad.postcode:"") : "Couldn't name the road. Check Maps.");
    });
  }, () => toast("This app can't read your location. Tap Open Maps and use the blue dot."), {enableHighAccuracy:true, timeout:12000, maximumAge:60000});
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const lk = e.target.closest("[data-copyreg]");
  if (lk){ const r = lk.dataset.copyreg; try{ navigator.clipboard.writeText(r).then(()=>toast(plate(r)+" copied. Paste it on GOV.UK"), ()=>toast("Enter "+plate(r)+" on GOV.UK")); }catch(_){ toast("Enter "+plate(r)+" on GOV.UK"); } return; }
  const t = e.target.closest("[data-tab],[data-car],[data-act],[data-range],[data-copy],[data-help]"); if (!t) return;
  if (t.dataset.help){ state.tab = t.dataset.help; render(); window.scrollTo(0,0); return; }
  if (t.dataset.goto){ state.carId = t.dataset.car; try{localStorage.setItem("cs.car",state.carId)}catch(_){ } state.tab = t.dataset.goto; state.highlight = t.dataset.key || null; render(); state.highlight = null;
    const card = t.dataset.key && document.getElementById("card-"+t.dataset.key); if (card) card.scrollIntoView({block:"start"}); else window.scrollTo(0,0); return; }
  if (t.dataset.act==="findme"){ findMe(); return; }
  if (t.dataset.act==="loccopy"){ const txt = locText(car(), readLoc()); try{ await navigator.clipboard.writeText(txt); toast("Location copied"); }catch(_){ toast("Copy isn't available here"); } return; }
  if (t.dataset.act==="locclear"){ try{ localStorage.removeItem("cs.loc"); }catch(_){} state.accRev++; render(); toast("Location cleared"); return; }
  if (t.dataset.act==="acccopy"){ const txt = reportText(car(), readForm()); try{ await navigator.clipboard.writeText(txt); toast("Details copied. Paste into a message or email"); }catch(_){ toast("Copy isn't available here"); } return; }
  if (t.dataset.act==="accclear"){ try{ localStorage.removeItem(draftKey()); }catch(_){} state.accRev++; render(); toast("Form cleared"); return; }
  if (t.dataset.act==="accclose"){ state.accEditId = null; state.accRev++; render(); return; }
  if (t.dataset.act==="accopen"){ state.accEditId = t.dataset.id; state.accRev++; render(); const f = $("#accForm"); if (f) f.scrollIntoView({block:"start"}); return; }
  if (t.dataset.act==="accdel"){ state.confirmDel = t.dataset.id; state.accRev++; render(); return; }
  if (t.dataset.act==="accdelyes"){ try{ await state.db.doc("accidents/"+t.dataset.id).delete(); state.confirmDel = null; state.accRev++; toast("Report removed"); }catch(err){ toast(errMsg(err)); } return; }
  if (t.dataset.act==="share"){ sharePolicy(); return; }
  if (t.dataset.act==="savepdf"){ savePolicy(); return; }
  if (t.dataset.act==="editfor"){ state.carId = t.dataset.car; try{localStorage.setItem("cs.car",state.carId)}catch(_){ } sheetDate(t.dataset.key); return; }
  if (t.dataset.tab){ state.tab = t.dataset.tab; render(); window.scrollTo(0,0); return; }
  if (t.dataset.car){ state.carId = t.dataset.car; try{localStorage.setItem("cs.car",state.carId)}catch(_){ } render(); const sc = car(); if (t.classList.contains("plate")) toast(plate(sc.reg)+" selected for Details, Contacts, Accident and Breakdown"); return; }
  if (t.dataset.range){ state.costRange = t.dataset.range; render(); return; }
  if (t.dataset.copy){ const v=t.dataset.copy; try{ await navigator.clipboard.writeText(v); toast("Copied "+v); }catch(_){ toast("Press and hold the number to copy it"); } return; }
  const a = t.dataset.act;
  if (a==="editdate") sheetDate(t.dataset.key);
  else if (a==="renew") sheetRenew(t.dataset.key);
  else if (a==="addcost") sheetCost();
  else if (a==="addcontact") sheetContact();
  else if (a==="editcontacts"){ e.preventDefault(); sheetEditContacts(); }
  else if (a==="editcar") sheetCar(false);
  else if (a==="addcar") sheetCar(true);
  else if (a==="del"){ state.confirmDel = t.dataset.id; render(); }
  else if (a==="delno"){ state.confirmDel = null; state.accRev++; render(); }
  else if (a==="delyes"){ try{ await state.db.doc("costs/"+t.dataset.id).delete(); state.confirmDel=null; toast("Entry removed"); }catch(err){ toast(errMsg(err)); } }
});
document.addEventListener("change", async e => {
  if (e.target.id!=="polfile" || !e.target.files[0]) return;
  const file = e.target.files[0];
  toast("Uploading…");

    const r = await state.assets.upload(file);
    await carRef().update({policy:{assetId:r.id, name:file.name, added:iso(todayLocal())}});
    toast("Policy saved");

});

/* ---------- data ---------- */
async function start(){
  if (!window.claude || !window.claude.use){ state.offline = true; render(); return; }
  const db = await window.claude.use("db");
  if (!db){ state.offline = true; render(); return; }
  state.db = db;
  window.claude.use("assets").then(a => { state.assets = a; if (a) render(); });
  db.collection("cars").onSnapshot(s => {
    state.cars = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b)=>(a.order||99)-(b.order||99));
    state.loaded = true; render();
  }, () => { state.offline = !state.cars.length; render(); });
  db.collection("accidents").onSnapshot(s => {
    state.accidents = s.docs.map(d => ({id:d.id, ...d.data()})); render();
  }, () => {});
  db.collection("costs").onSnapshot(s => {
    state.costs = s.docs.map(d => ({id:d.id, ...d.data()})); render();
  }, () => {});
}
/* ---------- standalone app extras: settings, backup, calendar, address lookup ---------- */
function fmtAgo(isoStr){ if (!isoStr) return "never"; const d = Math.round((Date.now()-new Date(isoStr))/MS); return d<=0?"today":d===1?"yesterday":d+" days ago"; }
async function openSettings(){
  const last = await CarStore.getMeta("backedUpAt"), changed = await CarStore.getMeta("changedAt");
  const stale = changed && (!last || changed > last);
  openSheet(`<h3>Your data</h3>
    <p class="small muted" style="margin:0">Everything is stored only on this phone. Back up after you change things, and keep the file somewhere safe like iCloud Drive.</p>
    <button type="button" class="opt" data-act="backup"><span class="optic">⤓</span><span>Back up now<small>Last backup: ${fmtAgo(last)}${stale?" · changes since then":""}</small></span></button>
    <label class="opt" for="restoreFile"><span class="optic">⤒</span><span>Restore from backup<small>Replaces what's on this phone</small></span><input type="file" id="restoreFile" accept=".json,application/json" hidden></label>
    <button type="button" class="opt" data-act="ics"><span class="optic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span><span>Add reminders to Calendar<small>Alerts 2 months, 1 month and on the day for each MOT, tax and insurance date</small></span></button>
    <button type="button" class="opt" data-act="wadates"><span class="optic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19.3L4 20z"/></svg></span><span>WhatsApp reminder dates<small>Copies your dates. Paste them into the CAR_DATES secret on GitHub after you renew anything</small></span></button>
    <p class="small muted" style="margin:0">Car Status · standalone version</p>`, async()=>{});
  const s = $("#sheetSave"); if (s) s.hidden = true;
}
function icsEscape(t){ return String(t).replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }
function buildICS(cars){
  const stamp = new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const ymd = s => s.replace(/-/g,""), next = s => { const d = parse(s); d.setDate(d.getDate()+1); return iso(d); };
  const links = {mot:"https://www.gov.uk/check-mot-status", tax:"https://www.gov.uk/check-vehicle-tax", insurance:""};
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Car Status//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Car Status"];
  cars.forEach(c => items(c).forEach(it => {
    if (!it.date) return;
    const ins = c.insurance||{};
    const who = it.key==="insurance" ? " ("+(ins.insurer||"insurer")+(ins.autoRenew?", auto-renews":", manual renewal")+")" : "";
    [["2m", addMonths(it.date,-2), "due in 2 months"], ["1m", addMonths(it.date,-1), "due in 1 month"], ["due", it.date, "due today"]].forEach(([stage, day, txt]) => {
      if (day < iso(todayLocal())) return;   // skip reminders already in the past
      const title = c.name+" "+plate(c.reg)+": "+it.label+" "+txt;
      const desc = it.label+" "+fmt(it.date)+who+(links[it.key]?"\n"+links[it.key]:"");
      lines.push("BEGIN:VEVENT","UID:"+c.id+"-"+it.key+"-"+stage+"-"+ymd(it.date)+"@car-status","DTSTAMP:"+stamp,
        "DTSTART;VALUE=DATE:"+ymd(day),"DTEND;VALUE=DATE:"+ymd(next(day)),"SUMMARY:"+icsEscape(title),"DESCRIPTION:"+icsEscape(desc),"TRANSP:TRANSPARENT",
        "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEscape(title),"TRIGGER;RELATED=START:PT9H","END:VALARM","END:VEVENT");
    });
  }));
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}
async function lookupAddress(lat, lon){
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=17&addressdetails=1&namedetails=1`, {headers:{"Accept-Language":"en-GB"}});
    if (!r.ok) return null;
    const j = await r.json(), a = j.address||{}, nd = j.namedetails||{};
    const town = a.town||a.city||a.village||a.suburb||a.hamlet||"";
    const ref = nd.ref || (/^[AMB]\d+/i.test(j.name||"") ? j.name : "");
    return { road: [a.road, town].filter(Boolean).join(", "), roadno: ref, postcode: a.postcode||"" };
  }catch(_){ return null; }
}
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act;
  if (a==="settings"){ openSettings(); }
  else if (a==="backup"){ try{ await CarStore.exportBackup(); toast("Backup saved"); closeSheet(); }catch(err){ if (!err || err.code!=="declined") toast("Backup didn't save. Try again."); } }
  else if (a==="ics"){ try{ await CarStore.saveFile("car-status-reminders.ics", new Blob([buildICS(state.cars)], {type:"text/calendar"})); }catch(_){} }
  else if (a==="wadates"){
    const txt = JSON.stringify(state.cars.map(c => ({car:c.name, reg:plate(c.reg), mot:c.mot||"", tax:c.tax||"", insurance:(c.insurance||{}).renewal||"", insurer:(c.insurance||{}).insurer||""})));
    try{ await navigator.clipboard.writeText(txt); toast("Dates copied. Paste into CAR_DATES on GitHub"); }catch(_){ toast("Copy isn't available here"); }
  }
  else if (a==="restoreFirst"){ $("#restoreFirst")?.click(); }
});
document.addEventListener("change", async e => {
  if (e.target.id!=="restoreFile" && e.target.id!=="restoreFirst") return;
  const f = e.target.files[0]; if (!f) return;
  try{ await CarStore.importBackup(f); toast("Restored. Reloading…"); setTimeout(() => location.reload(), 700); }
  catch(err){ toast(err && err.message ? err.message : "That file couldn't be read."); }
});
CarStore.persist();

render();
start();
setTimeout(()=>{ if(!state.db && !state.loaded){ state.offline = true; render(); } }, 11000);
})();
</script>
